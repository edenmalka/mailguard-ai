[project]
name = "mailguard-backend"
version = "0.1.0"
description = "Backend service that scores emails for maliciousness and explains the verdict."
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "tldextract>=5.4.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # import sorting
    "B",   # bugbear (likely bugs)
    "UP",  # modern Python syntax
    "S",   # bandit (security checks)
]

[tool.ruff.lint.per-file-ignores]
# Tests use `assert` (S101) and fake, test-only secrets (S105/S106).
"tests/**" = ["S101", "S105", "S106"]
# Review cases are literal URLs; splitting them would hurt readability.
"tests/test_links_review_cases.py" = ["S101", "E501"]
"tests/test_attachments_content_review_cases.py" = ["S101", "E501"]
